name: Install and publish audited v0.1.0

on:
  push:
    branches: [main]
    paths:
      - bootstrap/part-04

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RELEASE_TAG: v0.1.0
  ARCHIVE_SHA256: 4c088c1e7171ff884b256f07ca6e94dc405b209bc6f8a9faca966ab5eb988a72

jobs:
  install-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify and install final repository tree
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/finite-native-carry-operator-v0.1.0.tar.gz"
          cat bootstrap/part-* | base64 --decode > "${archive}"
          echo "${ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          final_root="${RUNNER_TEMP}/finite-native-carry-root"
          mkdir -p "${final_root}"
          tar -xzf "${archive}" -C "${final_root}"
          rsync -a --delete --exclude .git "${final_root}/" ./
          [[ ! -e bootstrap ]]
          [[ ! -e .github/workflows/bootstrap-v0.1.0.yml ]]
          python3 scripts/check_repository.py

      - name: Commit the audited repository root
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish finite native carry operator laboratory v0.1.0"
          final_sha="$(git rev-parse HEAD)"
          echo "FINAL_SHA=${final_sha}" >> "${GITHUB_ENV}"
          git push origin HEAD:main
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${final_sha}" ]]

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python and ledger audits
        run: bash scripts/run_python_audits.sh

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build formal root with warnings as errors
        run: lake build --wfail FiniteNativeCarryOperator

      - name: Create immutable annotated tag
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${FINAL_SHA}" ]]
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "${FINAL_SHA}" ]]
          else
            git tag --annotate "${RELEASE_TAG}" "${FINAL_SHA}" \
              --message "Finite Native Carry Operator ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Generate release evidence
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/finite-native-carry-release
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_OUTPUT}/audit"
          cp audit/SOURCE_SHA256.txt audit/RESULT_LEDGER_INDEX.json "${RELEASE_OUTPUT}/audit/"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            python3 --version
            lean --version | head -n 1
            lake --version
          } > "${RELEASE_OUTPUT}/audit/build-environment.txt"
          python3 scripts/create_release_manifest.py \
            --tag "${RELEASE_TAG}" \
            --output "${RELEASE_OUTPUT}/release-manifest-${RELEASE_TAG}.json"
          tar -czf "${RELEASE_OUTPUT}/audit-evidence-${RELEASE_TAG}.tar.gz" \
            -C "${RELEASE_OUTPUT}/audit" .
          (
            cd "${RELEASE_OUTPUT}"
            sha256sum \
              "release-manifest-${RELEASE_TAG}.json" \
              "audit-evidence-${RELEASE_TAG}.tar.gz" \
              > "release-assets-${RELEASE_TAG}.sha256"
          )
          {
            echo "# Finite Native Carry Operator ${RELEASE_TAG}"
            echo
            echo "Initial audited release of the finite real native-carry operator laboratory."
            echo
            echo "- exact C2 and all-base finite camera geometry;"
            echo "- CPU/CUDA float64 discovery;"
            echo "- arbitrary-precision Ridder localization without Newton;"
            echo "- cutoff ledgers through M=4,194,304;"
            echo "- two-layer dyadic asymptotic corrector with rolling holdouts;"
            echo "- Lean interface and interval-certification roadmap;"
            echo "- no claim of an interval-certified limiting value in this release."
            echo
            echo "Commit: `${FINAL_SHA}`"
          } > "${RELEASE_OUTPUT}/release-notes.md"

      - name: Publish GitHub release
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/finite-native-carry-release
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
            [[ "${state}" == $'false\tfalse' ]]
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Finite Native Carry Operator ${RELEASE_TAG}" \
              --notes-file "${RELEASE_OUTPUT}/release-notes.md" \
              "${RELEASE_OUTPUT}/release-manifest-${RELEASE_TAG}.json" \
              "${RELEASE_OUTPUT}/audit-evidence-${RELEASE_TAG}.tar.gz" \
              "${RELEASE_OUTPUT}/release-assets-${RELEASE_TAG}.sha256"
          fi
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"

      - name: Upload publisher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finite-native-carry-release-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/finite-native-carry-release
          if-no-files-found: error
          retention-days: 90
