name: Repair and install audited v0.1.0 root

on:
  push:
    branches: [main]
    paths:
      - bootstrap-repair/part-020

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ARCHIVE_SHA256: 5d01f2370f720d89f0046afd682d64545ce5433d6b2d5f628d8218bd71b3d730

concurrency:
  group: repair-finite-native-carry-v0.1.0
  cancel-in-progress: false

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out transport commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited source archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/finite-native-carry-operator-v0.1.0.tar.xz"
          cat bootstrap-repair/part-* | tr -d '\r\n' | base64 --decode > "${archive}"
          echo "${ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          final_root="${RUNNER_TEMP}/finite-native-carry-root"
          mkdir -p "${final_root}"
          tar -xJf "${archive}" -C "${final_root}"
          rsync -a --delete --exclude .git "${final_root}/" ./
          [[ ! -e bootstrap ]]
          [[ ! -e bootstrap-repair ]]
          [[ ! -e .github/workflows/repair-bootstrap-v0.1.0.yml ]]
          python3 scripts/check_repository.py

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python and evidence audits
        run: bash scripts/run_python_audits.sh

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build formal root with warnings as errors
        run: lake build --wfail FiniteNativeCarryOperator

      - name: Commit the validated repository root
        run: |
          set -euo pipefail
          rm -rf .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 scripts/check_repository.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish finite native carry operator laboratory v0.1.0"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${final_sha}" ]]
